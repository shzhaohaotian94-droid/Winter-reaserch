services:
  - type: web
    name: vibe-research-api
    env: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: VR_PUBLIC_READONLY
        value: "true"
      - key: VR_RESEARCH_ROOT
        value: /app/research
      - key: VR_ALLOW_ORIGINS
        value: "*"
  - type: web
    name: vibe-astock-api
    env: docker
    rootDir: integrations/vibe-astock
    plan: free
    autoDeploy: true
    envVars:
      - key: VIBE_ALLOW_HOSTS
        value: shzhaohaotian94-droid.github.io
      - key: VIBE_CORS_ORIGINS
        value: https://shzhaohaotian94-droid.github.io
